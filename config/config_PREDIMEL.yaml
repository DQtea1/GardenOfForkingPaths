# Configuration du pipeline consensus clustering.
#
# Usage :
#   python run_pipeline.py --config config.yaml
#
# Comment régler chaque paramètre (algo, distance, linkage, k…) : voir GUIDE_config.md
#
# Tout paramètre passé en ligne de commande a la PRIORITÉ sur ce fichier ;
# le YAML a lui-même la priorité sur les défauts internes. Exemple :
#   python run_pipeline.py --config config.yaml --k-max 12 --compute_jaccard n
# lance le run décrit ici mais force k-max=12 et désactive la stabilité Jaccard.
#
# Les clés utilisent des underscores (n_top_genes, color_by, tsne_dim, ...),
# pas des tirets. Une valeur laissée à `null` reprend le défaut interne.

# ================================================= 1 · Entrées / sorties — _setup() + _load_data() + _load_metadata()
counts: /mnt/d/00_PUBLIC_DATA/00_DATASETS/01_BULK/00_MERGED/01_MELANOMA/PREDIMEL_78220_91061_23709/rawCounts/expression_corrected_counts_symbol.csv                  # OBLIGATOIRE : matrice csv/tsv/parquet (gènes en lignes)
samples_in_rows: false        # true si les échantillons sont en lignes
metadata: /mnt/d/00_PUBLIC_DATA/00_DATASETS/01_BULK/00_MERGED/01_MELANOMA/PREDIMEL_78220_91061_23709/rawCounts/clinical_metadata.csv                # csv/tsv indexé par échantillon (annotations cliniques)
color_by: antipd1                # colonne des métadonnées à superposer sur les embeddings
outdir: /mnt/d/03_SARAH_projet/01_OUTPUTS/ConsensusClustering/PREDIMEL           # dossier de sortie

# ================================================= 2 · Prétraitement (normalisation, gènes variables) — _preprocess_matrix()
# Exécuté APRÈS l'harmonisation (étape 3) : sinon le VST, de loin le calcul le
# plus cher du démarrage, serait fait deux fois — une fois sur les identifiants
# d'origine, une fois sur les identifiants harmonisés.
already_normalized: false     # true si entrée déjà en VST/rlog/logCPM (saute filtrage + normalisation)
norm_method: vst              # normalisation des counts bruts : vst (DESeq2/PyDESeq2, défaut) | logcpm
min_cpm: 1.0
min_frac_samples: 0.2
keep_technical: false         # true = garde les gènes RP/MT/HB
n_top_genes: 5000
variance_method: mad          # mad | var
scale_genes: false            # true = z-score par gène

# 2b · Le prétraitement précède forcément la détection d'outliers (5), qui a
# besoin d'une matrice normalisée. Tout ce que l'étape 2 décide — gènes retenus,
# size factors, médiane de centrage, sélection des n_top_genes les plus
# variables — l'est donc en tenant compte de tumeurs sur le point d'être
# écartées. 'y' rejoue le prétraitement sur la seule cohorte conservée (coût :
# un second VST, uniquement si des tumeurs ont été retirées).
refit_after_sample_filters: y  # y | n

# ================================================= 3 · Harmonisation des identifiants de gènes — _harmonize_gene_ids()
# Une matrice qui fusionne plusieurs lots peut mélanger plusieurs espaces
# d'identifiants (Entrez « 10264 », Ensembl « ENSG00000141510 », symboles
# « TP53 »). La jointure les rend DISJOINTS : chaque lot est non nul sur son
# espace et à zéro partout ailleurs. Conséquences, toutes silencieuses :
#   - tout filtre de prévalence (« exprimé chez >= 30 % des tumeurs ») élimine
#     par construction l'espace minoritaire ;
#   - ces tumeurs deviennent entièrement nulles et font échouer DESeq2 ;
#   - GSEA, signatures et déconvolution ne reconnaissent que les symboles HGNC.
#
# L'étape journalise d'abord un DIAGNOSTIC (tables/gene_id_types.csv et
# gene_id_types_by_sample.csv : quel identifiant est de quel type, quelle tumeur
# porte ses comptes sur quel espace), puis convertit vers les symboles.
# La trace de conversion part dans tables/gene_id_harmonization.csv.
harmonize_gene_ids: n         # y | n — active l'harmonisation vers les symboles HGNC

# La table de correspondance est le « HGNC complete gene set » de genenames.org
# — exactement le jeu de données que le paquet R `hgnc` charge via
# import_hgnc_dataset() et interroge via crosswalk(). Il couvre en une passe
# entrez_id, ensembl_gene_id, refseq_accession, prev_symbol et alias_symbol.
# Téléchargé une seule fois (~17 Mo) puis mis en cache sous
# ~/.cache/gardenofforks/ : les runs suivants sont hors ligne.
harmonize_hgnc_file: null     # null = téléchargement + cache ; un chemin fige la version

harmonize_map_aliases: y      # y | n — ramène aussi les symboles PÉRIMÉS et les alias
                              #   à leur symbole approuvé (p53 -> TP53, A1BGAS -> A1BG-AS1).
                              #   Les alias ambigus (plusieurs cibles) sont toujours ignorés.
harmonize_drop_unmapped: n    # y = retire les IDs inconnus du jeu HGNC ; n = les garde tels quels

# ================================================= 4 · Pureté tumorale (PUREE) — _purity_filter()
purity_threshold: 0           # seuil dans ]0,1[ ; 0 / null / false = pas de filtrage (PUREE non lancé)
purity_direction: higher      # higher = garde puretés >= seuil ; lower = garde puretés <= seuil
puree_dir: /home/quentin/02_MODELS/PUREE               # dépôt PUREE (predict_purity.py, models/, data/)
puree_python: /home/quentin/miniforge3/envs/PUREE/bin/python  # interpréteur de l'env PUREE
puree_gene_id: HGNC           # HGNC (symboles) | ENSEMBL

# ================================================= 5 · Filtrage d'outliers (ACP) — _outlier_filter()
outlier_sd_threshold: 3       # ACP + retrait des tumeurs à > N SD sur une CP ; 0 = aucun retrait
outlier_n_pc: 5               # nombre de composantes inspectées pour la détection d'outliers
outlier_min_explained_var: 0.0  # si > 0 : inspecte les CP à variance expliquée > seuil (0.08 = 8 %) au lieu de n_pc

# ================================================= 6 · Collections de gene sets — partagées par les étapes 7, 9, 13 et 14
# Collections de gene sets pour le GSEA : un dictionnaire {nom: chemin.gmt}.
# Commenter la ligne pour ne pas utiliser une collection. Si toutes commentées.
# Elles servent, dans cet ordre, au DEGSEA clinique (7), au GSEA des
# métagènes ICA (9), au DEGSEA par cluster (13) et, en repli, à la
# projection de signatures (14) : déclarées ici, avant leur premier
# consommateur.
gsea_collections:
  # c1: /mnt/d/00_PUBLIC_DATA/00_DATASETS/00_REFDATA/gene_sets_and_pathways/gmt/c1.gmt   # Positional — bandes cytogénétiques (300)
  # c2: /mnt/d/00_PUBLIC_DATA/00_DATASETS/00_REFDATA/gene_sets_and_pathways/gmt/c2.gmt   # Curated — Reactome/KEGG/WikiPathways… (6495)
  # c3: /mnt/d/00_PUBLIC_DATA/00_DATASETS/00_REFDATA/gene_sets_and_pathways/gmt/c3.gmt   # Regulatory targets — TFT + miRNA (3713)
  # c4: /mnt/d/00_PUBLIC_DATA/00_DATASETS/00_REFDATA/gene_sets_and_pathways/gmt/c4.gmt   # Computational cancer — CGN + CM (858)
  # c5: /mnt/d/00_PUBLIC_DATA/00_DATASETS/00_REFDATA/gene_sets_and_pathways/gmt/c5.gmt   # Ontology — GO + HPO (28339, TRÈS LENT)
  # c6: /mnt/d/00_PUBLIC_DATA/00_DATASETS/00_REFDATA/gene_sets_and_pathways/gmt/c6.gmt   # Oncogenic (189)
  # c7: /mnt/d/00_PUBLIC_DATA/00_DATASETS/00_REFDATA/gene_sets_and_pathways/gmt/c7.gmt   # Immunologic — ImmuneSigDB + vaccins (5219)
  # c8: /mnt/d/00_PUBLIC_DATA/00_DATASETS/00_REFDATA/gene_sets_and_pathways/gmt/c8.gmt   # Cell type — single-cell (830)
  h:  /mnt/d/00_PUBLIC_DATA/00_DATASETS/00_REFDATA/gene_sets_and_pathways/gmt/h.gmt    # Hallmark (50)
  # sigGeNeHetX: /mnt/d/00_PUBLIC_DATA/00_DATASETS/00_REFDATA/gene_sets_and_pathways/gmt/sigGeNeHetX.gmt  # Custom immun (164)
  signatures_select: /mnt/d/00_PUBLIC_DATA/00_DATASETS/00_REFDATA/gene_sets_and_pathways/gmt/signatures_select.gmt  # Custom curées

gsea_gene_sets: ~/.cache/gseapy/Enrichr.MSigDB_Hallmark_2020.gmt  # .gmt unique de repli (si gsea_collections vide)
gsea_permutations: 1000       # permutations du GSEA pré-classé

# ================================================= 7 · DEGSEA clinique (DESeq2 ajusté + GSEA) — _clinical_degsea()
# Filtrage des gènes en entrée du DEGSEA clinique  (onglet « Expression
# Analysis » du rapport).
#
# ATTENTION : le DEGSEA part des counts BRUTS — DESeq2 modélise des comptages,
# pas une matrice normalisée. Les filtres de l'étape 2 (min_cpm,
# keep_technical, n_top_genes) ne s'appliquent QU'À la matrice du clustering et
# ne touchent pas le DEGSEA. Les options ci-dessous rejouent ces familles de
# filtres pour l'analyse différentielle, avec leurs propres seuils.
# Elles sont appliquées APRÈS la sélection des échantillons du contraste : les
# seuils portent donc sur la cohorte réellement testée.
clinical_degsea_drop_pca_outliers: n   # y | n — y : restreint le DEGSEA clinique aux tumeurs conservées
                                       #   aux étapes 4 et 5 (pureté PUREE + outliers ACP). n (défaut) : le DEGSEA
                                       #   clinique porte sur TOUTES les tumeurs, outliers ACP inclus.

clinical_degsea_filter_low_counts: y   # y | n — filtre d'expression sur counts bruts
clinical_degsea_min_count_per_sample: 15   # counts bruts minimum par tumeur
clinical_degsea_min_frac_samples: 0.30     # ... atteints par >= 30 % des tumeurs testées

clinical_degsea_filter_technical: y    # y | n — retire ribosomiques / mitochondriaux / hémoglobines
clinical_degsea_technical_patterns:    # expressions régulières (commenter le bloc = défauts)
  - "^RP[LS]"                          # protéines ribosomiques
  - "^MRP[LS]"                         # ribosomiques mitochondriales
  - "^MT-"                             # gènes mitochondriaux
  - "^HB[ABDEGMQZ]\\d?$"               # hémoglobines

clinical_degsea_filter_unmapped: y     # y | n — retire ce qui n'est pas un gène annoté
clinical_degsea_unmapped_patterns:
  - "^[A-Z]{1,2}\\d{5,6}\\.\\d+$"      # clones génomiques : AC243964.4, AL139246.5, Z98884.2
  - "^ENSG\\d+"                        # identifiants Ensembl non convertis en symboles HGNC

# Présélection par variance. DÉCONSEILLÉ pour du différentiel : DESeq2 estime sa
# tendance de dispersion sur l'ensemble des gènes, et son filtrage indépendant
# suppose un univers non présélectionné — restreindre aux plus variables biaise
# les deux, donc les padj. À n'activer que pour une exploration rapide.
clinical_degsea_select_variable: n     # y | n
clinical_degsea_n_top_genes: 5000
clinical_degsea_variance_method: mad   # mad (robuste) | var

# DERNIER filtre de la série, et le seul qui porte sur les TUMEURS : il juge
# chaque tumeur sur les gènes finalement retenus ci-dessus. Une tumeur quasi
# vide sur ces gènes-là n'est pas interprétable, et elle fait échouer DESeq2 :
# l'estimation 'poscounts' des size factors prend la médiane de ses comptes
# positifs, donc renvoie NaN s'il n'y en a aucun — NaN qui se propage ensuite à
# TOUTES les tumeurs via la moyenne géométrique des size factors.
clinical_degsea_filter_zero_samples: y   # y | n
clinical_degsea_max_zero_frac: 0.80      # retire les tumeurs à plus de 80 % de gènes à 0

# DEGSEA clinique indépendant du consensus. Décommenter/adapter pour exécuter
# plusieurs expériences ; chaque résultat est exporté dans tables/clinical_degsea/<nom>/.

# --- Garde-fous numériques de l'ajustement DESeq2 (DEGSEA clinique) ---------
# Mêmes deux protections qu'à l'étape 13, seuils INDÉPENDANTS.
clinical_degsea_cooks_filter: y
clinical_degsea_refit_cooks: y
clinical_degsea_independent_filter: y      # filtrage indépendant de DESeq2
clinical_degsea_min_disp: 1e-8             # plancher de dispersion PyDESeq2
clinical_degsea_flag_low_dispersion: y     # marque les dispersions invraisemblables
clinical_degsea_min_plausible_disp: 1e-3   # seuil du marquage (tumeur réelle : 0,1 - 0,5)

# STRATIFICATION du DEGSEA clinique. Pour chaque modalité de chacune de ces
# colonnes, TOUTE la batterie de designs `clinical_degsea` ci-dessous est
# rejouée sur les seules tumeurs de cette modalité. Dans le rapport, onglet
# « Expression Analysis » > « DEGSEA », cela donne trois menus
# en cascade : colonne de filtrage -> modalité -> design.
#
# 'None' / 'NA' / 'ALL' désignent l'analyse non filtrée. Elle est de toute façon
# TOUJOURS produite (clé « ALL »), la mentionner ici est donc facultatif.
#
# COÛT : le nombre d'ajustements DESeq2 vaut n_designs x (1 + somme des
# modalités de chaque colonne). Les combinaisons dont les effectifs sont sous
# `min_group` sont écartées AVANT calcul ; le détail complet, calculées comme
# écartées, part dans tables/clinical_degsea/plan.csv.
group_DESeq2_by: []           # ex. [histo_classe] ; vide = analyse non filtrée seule

# Les colonnes à relire en CHAÎNES sont DÉDUITES automatiquement : celles citées
# comme `contrast` par les designs ci-dessous, plus celles de `group_DESeq2_by`.
# Sans ce cast, une colonne 0/1 serait traitée par DESeq2 comme une covariable
# CONTINUE ; et un seul NA la ferait lire en float, ses modalités devenant
# '0.0'/'1.0' — le contraste sélectionnerait alors zéro tumeur.

clinical_degsea:
  response:
    design: "~ PDSD_PRCR"
    contrast: PDSD_PRCR          # accepte aussi la clé française : contraste
    control: NR
    test: R
    collections: [h]        # noms issus de gsea_collections ; omission = toutes les collections
    min_group: 3
  response_age_batch:
    design: "~ batch + PDSD_PRCR"
    contrast: PDSD_PRCR
    control: NR
    test: R
    collections: [h]

# ================================================= 7b · OUTRIDER — expression aberrante — _outrider()
# OUTRIDER cherche les gènes anormalement exprimés CHEZ UNE TUMEUR : un
# autoencodeur apprend « ce qui est normal » sur la population, puis chaque
# comptage est testé contre sa valeur attendue (binomiale négative, FDR).
#
# `subset_by` déclare les découpages : le modèle n'a de sens que sur une
# population COMPARABLE. Chaque combinaison de modalités réellement observée
# donne UN run indépendant (autoencodeur, size factors et FDR propres).
#
#   type_sexe: [cancer_type, sexe]  -> melanome×M, melanome×F, sarcome×M, …
#   cohorte:   []                   -> un seul run, toute la cohorte
#
# Les combinaisons sous outrider_min_samples sont écartées AVANT calcul ; le
# plan complet part dans tables/outrider/plan.csv, et le rapport propose un menu
# déroulant pour choisir le run affiché.
run_outrider: n               # y | n — étape longue (un autoencodeur par sous-groupe)

subset_by:
  cohorte: []                 # liste vide = un seul run sur toute la cohorte
  # antipd1: [antipd1]

outrider_python: null         # interpréteur de l'env py_outrider ; null = celui du pipeline
outrider_profile: outrider    # outrider (counts RNA-seq) | protrider (protéines) | pca
outrider_encod_dim: null      # null = recherche d'hyperparamètre (correct, TRÈS long)
outrider_iterations: null     # null = défaut du profil (15)
outrider_min_samples: 30      # sous ce seuil, le sous-groupe est écarté sans calcul
outrider_min_count: 10        # counts bruts minimum par tumeur pour tester un gène…
outrider_min_frac_samples: 0.25   # … chez au moins 25 % des tumeurs DU SOUS-GROUPE
outrider_min_genes: 100
outrider_alpha: 0.05
outrider_max_events: 5000

# Figures : les 14 graphiques du paquet R OUTRIDER sont rejoués dans le rapport
# (un sous-onglet chacun), avec clic sur un gène -> GeneCards et clic sur une
# tumeur -> ses données cliniques.
outrider_figures: y           # y | n
outrider_figure_cells: 20000  # budget en cellules (gènes × tumeurs) ≈ 1 Mo par run
outrider_heatmap_genes: 100   # gènes de la heatmap gènes × tumeurs

outrider_covariates: null
outrider_extra_args: null
outrider_keep_h5ad: y

# ================================================= 8 · ICA stabilisée (branche parallèle) — _ica()
# Branche indépendante du consensus clustering : évalue la MSTD, sauvegarde la
# MSTD, ses dimensions testées voisines inférieure/supérieure et la meilleure
# stabilité moyenne, puis applique consensus/embeddings/associations sur chaque
# projection ICA. Nécessite : pip install stabilized-ica
run_ica: y
ica_n_components_min: 5       # borne basse de la fourchette MSTD
ica_n_components_max: 10      # borne haute de la fourchette MSTD
ica_n_components_step: 1      # pas entre dimensions testées
ica_n_runs: 100                # FastICA répétées par dimension (stabilité)
ica_top_dimensions: 4         # maximum 1–4 : MSTD, ↓ voisin, ↑ voisin, ~ meilleure stabilité moyenne
ica_algorithm: fastica_par    # fastica_par | fastica_def | picard_*
ica_fun: logcosh              # logcosh | exp | cube | tanh
ica_resampling: none          # none | bootstrap | fast_bootstrap
ica_max_iter: 2000
ica_deterministic: y          # y = reproductible (n_jobs ICA forcé à 1) ; n = plus rapide, non déterministe
ica_k_final: null             # null = sélection automatique, sinon k imposé pour l'ICA

# ================================================= 9 · GSEA des métagènes ICA — _ica_metagene_gsea()
run_ica_gsea: y               # y | n — GSEA preranked sur les poids signés de chaque métagène
ica_gsea_min_size: 15         # taille minimale d'un gene set
ica_gsea_max_size: 500        # taille maximale d'un gene set

# ================================================= 10 · Consensus clustering (+ choix de k) — AnalysisBranch._run_consensus()
# Appliqué à CHAQUE branche : d'abord les projections ICA retenues
# (_run_ica_branches), puis la matrice d'expression (_run_primary_branch).
k_min: 3
k_max: 8
n_resamples: 2000
prop_samples: 0.8
prop_genes: 0.8
sample_mode: bootstrap        # subsample | bootstrap
gene_mode: bootstrap          # subsample | bootstrap
base: hierarchical            # hierarchical | kmeans | kmedoids
metric: pearson               # pearson | spearman | euclidean | cosine
linkage: average              # average | complete | ward | single
k_final: null                 # entier pour forcer k ; null = choix automatique (voir k_criterion)
k_criterion: pac             # choix auto de k : pac (min PAC) | deltak (coude Δ(K)) | both
min_cluster_size: 10

# ================================================= 11 · Stabilité des branches (Jaccard bootstrap) — _run_branch_stability()
compute_jaccard: y            # y | n

# ================================================= 12 · Embeddings (t-SNE / UMAP) — _run_embeddings()
tsne_dim: 3                   # 2 (PNG) | 3 (HTML interactif, nécessite plotly)
# Espaces de distance sur lesquels t-SNE / UMAP sont appris. Un menu "Distance"
# du rapport (onglets Consensus et ICA) permet de passer de l'un à l'autre.
#   consensus   -> D_K = 1 - C_K, recalculé pour chaque k (comportement historique)
#   euclidean | correlation | manhattan -> calculées directement sur la matrice
#   d'entrée de la branche (scores des composantes côté ICA) ; indépendantes de k
embedding_distances: [consensus, euclidean, correlation, manhattan]
perplexity: 30.0
n_neighbors: 15
min_dist: 0.1
no_umap: false                # true = ne calcule pas l'UMAP

# ================================================= 13 · DEGSEA par cluster (DESeq2 + GSEA) — _degsea_all_k()
run_degsea: y                 # y | n — DESeq2 + GSEA par cluster (étape longue). counts bruts + symboles HGNC

degsea_mode: ova            # ova (one-vs-all) | ovo (one-vs-one) | both — nécessaire pour les deux types de volcanos du rapport
degsea_all_k: y              # y | n — si y : DEGSEA calculé pour TOUS les k [k_min..k_max]
                             #   (tables/degsea/k<k>/ par k + panneau DEGSEA alignable sur chaque k
                             #   dans le rapport). Très coûteux. Défaut n : seul le k recommandé PAC+Delta(K).
gsea_heatmap_pval: 0.05       # heatmap : garde tous les pathways à p-valeur nominale < ce seuil dans >= 1 cluster

# Filtrage des gènes en entrée du DEGSEA par cluster (onglet « Résultats
# Consensus-Clustering » > sous-onglet « DEGSEA » du rapport).
#
# ATTENTION : le DEGSEA part des counts BRUTS — DESeq2 modélise des comptages,
# pas une matrice normalisée. Les filtres de l'étape 2 (min_cpm,
# keep_technical, n_top_genes) ne s'appliquent QU'À la matrice du clustering et
# ne touchent pas le DEGSEA. Les options ci-dessous rejouent ces familles de
# filtres pour l'analyse différentielle par cluster.
#
# Ces seuils sont INDÉPENDANTS de ceux du DEGSEA clinique (clinical_degsea_*,
# étape 7) : les deux onglets peuvent être filtrés différemment.
# Le filtrage est appliqué une seule fois, sur la partition entière, pour que
# tous les contrastes (one-vs-all et one-vs-one) partagent le même univers de
# gènes et que les NES restent comparables d'un cluster à l'autre.
# Les tumeurs, elles, sont déjà celles de la partition : les outliers ACP et le
# filtre de pureté (étape 4) y sont donc déjà appliqués (contrairement au
# DEGSEA clinique, qui a son option clinical_degsea_drop_pca_outliers).

degsea_filter_low_counts: y            # y | n — filtre d'expression sur counts bruts
degsea_min_count_per_sample: 15        # counts bruts minimum par tumeur
degsea_min_frac_samples: 0.30          # ... atteints par >= 30 % des tumeurs de la partition

degsea_filter_technical: y             # y | n — retire ribosomiques / mitochondriaux / hémoglobines
degsea_technical_patterns:             # expressions régulières (commenter le bloc = défauts)
  - "^RP[LS]"                          # protéines ribosomiques
  - "^MRP[LS]"                         # ribosomiques mitochondriales
  - "^MT-"                             # gènes mitochondriaux
  - "^HB[ABDEGMQZ]\\d?$"               # hémoglobines

degsea_filter_unmapped: y              # y | n — retire ce qui n'est pas un gène annoté
degsea_unmapped_patterns:
  - "^[A-Z]{1,2}\\d{5,6}\\.\\d+$"      # clones génomiques : AC243964.4, AL139246.5, Z98884.2
  - "^ENSG\\d+"                        # identifiants Ensembl non convertis en symboles HGNC

# Présélection par variance. DÉCONSEILLÉ pour du différentiel : DESeq2 estime sa
# tendance de dispersion sur l'ensemble des gènes, et son filtrage indépendant
# suppose un univers non présélectionné — restreindre aux plus variables biaise
# les deux, donc les padj. À n'activer que pour une exploration rapide.
degsea_select_variable: n              # y | n
degsea_n_top_genes: 5000
degsea_variance_method: mad            # mad (robuste) | var

# DERNIER filtre de la série, et le seul qui porte sur les TUMEURS : il juge
# chaque tumeur sur les gènes finalement retenus ci-dessus. Une tumeur quasi
# vide sur ces gènes-là n'est pas interprétable, et elle fait échouer DESeq2 :
# l'estimation 'poscounts' des size factors prend la médiane de ses comptes
# positifs, donc renvoie NaN s'il n'y en a aucun — NaN qui se propage ensuite à
# TOUTES les tumeurs via la moyenne géométrique des size factors.
degsea_filter_zero_samples: y          # y | n
degsea_max_zero_frac: 0.80             # retire les tumeurs à plus de 80 % de gènes à 0

# --- Garde-fous numériques de l'ajustement DESeq2 ---------------------------
# 1) VALEURS ABERRANTES (Cook) : refit_cooks remplace les comptages extrêmes par
#    la moyenne tronquée puis réajuste ; cooks_filter met padj à NA pour ces
#    gènes plutôt que de les déclarer significatifs (cooksCutoff de DESeq2 en R).
# 2) DISPERSION EFFONDRÉE : z = log2FC / lfcSE, et lfcSE croît comme la racine de
#    la dispersion. Une estimation de dispersion en échec fait exploser |z| sans
#    que l'effet ait bougé — la « barre » de gènes au plafond d'un volcano.
#    flag_low_dispersion marque ces gènes (colonne `dispersion_suspecte`) et les
#    exclut de l'étiquetage, sans rien supprimer.
degsea_cooks_filter: y
degsea_refit_cooks: y
degsea_independent_filter: y      # filtrage indépendant de DESeq2 (puissance FDR)
degsea_min_disp: 1e-8             # plancher de dispersion PyDESeq2
degsea_flag_low_dispersion: y     # marque les dispersions invraisemblables
degsea_min_plausible_disp: 1e-3   # seuil du marquage (tumeur réelle : 0,1 - 0,5)

# ================================================= 14 · Projection de signatures — _signatures()
compute_signatures: y         # y | n — score les signatures par tumeur (ssGSEA + expression moyenne) et teste l'association aux variables cliniques

# Sources de signatures à projeter, HARMONISÉES : chacune a sa propre nomenclature,
# on les ramène toutes à {signature: gènes}. Ajoute une entrée pour une nouvelle
# source, aucun changement de code requis.
#   format: gmt  -> fichier .gmt standard
#   format: csv  -> une signature par ligne ; colonnes name_col / genes_col / detail_col
#                   et séparateur des gènes genes_sep
signature_sources:
  select:                     # signatures curées à la main (Ayers anti-PD1, CAF, ICA, PREDIMEL…)
    format: gmt
    path: /mnt/d/00_PUBLIC_DATA/00_DATASETS/00_REFDATA/gene_sets_and_pathways/gmt/signatures_select.gmt
  sigGeNeHetX:                # signatures immunes maison (Neutro-atlas)
    format: gmt
    path: /mnt/d/00_PUBLIC_DATA/00_DATASETS/00_REFDATA/gene_sets_and_pathways/gmt/sigGeNeHetX.gmt
  IPRES:                      # résistance anti-PD1 (Hugo et al. 2016) — CSV
    format: csv
    path: /mnt/d/00_PUBLIC_DATA/00_DATASETS/00_REFDATA/IPRES/IPRES.csv
    name_col: Geneset
    genes_col: Gene Listing
    detail_col: Detail
    genes_sep: ";"

sig_corr_method: spearman     # variables continues : spearman | pearson (catégorielles = Wilcoxon)
sig_top_n: 8                  # nb de top signatures affichées par variable
sig_pval: 0.05                # seuil FDR pour retenir une signature comme significative

# ================================================= 15 · Déconvolution (omnideconv / immunedeconv) — _deconvolution()
run_deconv: y                 # y | n — batterie de déconvolution (étape longue ; R en sous-processus)

# Référence single-cell (uniquement pour DWLS / BayesPrism ; les 4 autres n'en ont pas besoin).
# format: rds (Seurat/SingleCellExperiment) ; counts_csv prévu pour l'avenir.
deconv_reference:
  format: rds
  path: /mnt/d/00_PUBLIC_DATA/00_DATASETS/02_SingleCell/01_MELANOMA/GSE269936/GSE269936_ref_melan_sc.rds
  celltype_col: cell_type     # colonne des types cellulaires (14 types : B, CD8 T, Tumor, Fibroblast…)
  batch_col: patient_sample   # colonne batch/échantillon (36) pour la correction d'effet lot
  max_cells_per_type: 200     # sous-échantillonnage de la référence (tractabilité DWLS/BayesPrism)

# Méthodes : `enabled` + paramètres propres à chacune. Tout activé par défaut ;
# les paramètres inconnus d'une méthode sont ignorés (filtrés côté R).
deconv_methods:
  mcp_counter: {enabled: true}                            # scores d'abondance (sans référence)
  xcell:       {enabled: false}                            # scores d'enrichissement, 64 types (sans référence)
  quantiseq:   {enabled: true, tumor: true}               # fractions absolues (tumor=true retire "uncharacterized")
  epic:        {enabled: false, tumor: true}               # fractions (signature TRef adaptée aux tumeurs)
  dwls:        {enabled: false, dwls_method: mast_optimized}  # fractions, via référence single-cell
  bayesprism:  {enabled: false}                            # fractions, via référence single-cell — TRÈS LENT

# ================================================= 16 · Khi² d'indépendance (variables catégorielles) — _clinical_analyses()
run_chi2: y                   # y | n — croise cluster (chaque k) × clinique catégoriel + clinique × clinique
                              #   (khi², Fisher/Monte-Carlo en repli, V de Cramér, résidus ajustés). Léger.
chi2_mc_resamples: 2000       # permutations du khi² de Monte-Carlo (repli des tables R×C non conformes à Cochran)

# Variables ORDINALES : un croisement impliquant une ordinale et un axe scorable
# (ordinal ou binaire) utilise un TEST DE TENDANCE (Cochran-Armitage / linéaire)
# au lieu du khi² nominal. Donner l'ordre explicite des modalités (recommandé) :
ordinal_variables:
  # stade: [I, II, III, IV]
  # grade: [G1, G2, G3]
  # (forme courte : `ordinal_variables: [stade, grade]` -> ordre = tri des modalités)

# ================================================= 17 · Corrélations (variables continues) — _clinical_analyses()
run_correlations: y           # y | n — corrèle clinique continue × signatures/déconv + signatures × déconv
corr_method: spearman         # spearman (robuste, défaut) | pearson
corr_all_pairs: y             # y = aussi signature×signature et déconv×déconv (redondant/compositionnel)

# ================================================= 18 · Rapport d'analyse (HTML interactif) — _report()
create_report: y              # y | n — génère outdir/report.html (rapport autonome de tous les résultats)

# ================================================= 19 · Divers (transversal : parallélisation, graine)
parallel: y                   # y (défaut) = parallélise consensus/Jaccard/DEGSEA/embeddings sur n_jobs ; n = tout séquentiel (n_jobs=1)
n_jobs: -1                    # -1 = tous les cœurs (ignoré si parallel=n)
seed: 42
log_file: run.log             # journal horodaté de la progression (relatif à outdir si non absolu)
