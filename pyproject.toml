[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gardenofforks"
version = "0.1.0"
description = "Consensus clustering de tumeurs à partir de bulk RNA-seq : branches consensus et ICA stabilisée, diagnostics, DEGSEA, signatures, déconvolution et rapport HTML autonome."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Quentin Despretz", email = "quentin.despretz@gmail.com" }]
keywords = ["bioinformatics", "rna-seq", "consensus-clustering", "ica", "transcriptomics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Cœur du pipeline : prétraitement, consensus clustering, diagnostics, figures.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",          # lecture du fichier de configuration --config
]

# Étapes optionnelles. ATTENTION : la configuration PAR DÉFAUT du pipeline
# (norm_method=vst, run_ica=y, run_ica_gsea=y) a besoin de `vst`, `ica` et
# `gsea` — autrement dit, l'installation de base ne suffit qu'avec
# --already-normalized (ou --norm_method logcpm) et --run_ica n.
# En pratique : installer l'extra `full`.
[project.optional-dependencies]
vst = ["pydeseq2>=0.5"]                 # normalisation VST (norm_method=vst, défaut)
gsea = ["gseapy>=1.1"]                  # GSEA pré-classé (DEGSEA, GSEA des métagènes ICA)
degsea = ["pydeseq2>=0.5", "gseapy>=1.1"]  # étape DEGSEA complète (run_degsea=y)
ica = ["stabilized-ica>=2.0.0"]         # branche ICA stabilisée (MSTD, métagènes, projections)
umap = ["umap-learn>=0.5.4"]            # embeddings UMAP ; sans lui, lancer avec --no-umap
plotly = ["plotly>=5.18"]               # embeddings 3D interactifs (--t-SNE_dim 3)
parquet = ["pyarrow>=14.0"]             # lecture de matrices au format parquet
full = [
    "pydeseq2>=0.5",
    "gseapy>=1.1",
    "stabilized-ica>=2.0.0",
    "umap-learn>=0.5.4",
    "plotly>=5.18",
    "pyarrow>=14.0",
]
dev = ["pytest>=8.0"]

# PUREE (pureté tumorale, purity_threshold) n'est pas listé : il tourne en
# sous-processus dans son propre environnement (--puree_dir / --puree_python),
# avec ses dépendances figées. L'installer séparément : cf. son README.
#
# La déconvolution (run_deconv=y) délègue à R via gardenofforks/deconvolve.R :
# omnideconv et immunedeconv s'installent côté R, pas ici.

[project.scripts]
gof-run = "gardenofforks.run_pipeline:main"
gof-demo = "gardenofforks.demo_pipeline:main"
gof-nullcheck = "gardenofforks.null_check:main"
gof-make-demo-data = "gardenofforks.make_demo_data:cli"

[project.urls]
Documentation = "https://github.com/DaFreeOne/GardenOfForks#readme"

[tool.setuptools]
packages = ["gardenofforks"]

# Fichiers non-Python chargés à l'exécution via Path(__file__) :
#   report.py  -> report_template.html
#   deconv.py  -> deconvolve.R (lancé en sous-processus Rscript)
[tool.setuptools.package-data]
gardenofforks = ["report_template.html", "deconvolve.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
